[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sandbox"
version = "0.2.0"
description = "Simple, opinionated wrapper for Docker Sandboxes and OpenCode-compatible providers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

authors = [{ name = "GSA TTS", email = "william.zujkowski@gsa.gov" }]

maintainers = [
    { name = "William Zujkowski", email = "william.zujkowski@gsa.gov" },
]

keywords = [
    "docker",
    "sandbox",
    "opencode",
    "openai-compatible",
    "developer-tools",
    "security",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

dependencies = ["typer>=0.12,<1.0"]

[project.optional-dependencies]
dev = [
    "bandit>=1.7,<2.0",
    "pytest>=8.2,<9.0",
    "pytest-cov>=5,<6",
    "ruff>=0.9,<1.0",
]

[project.scripts]
agent-sandbox = "agent_sandbox.cli:app"

# ------------------------
# SETUPTOOLS
# ------------------------

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_sandbox*"]
exclude = ["tests*", "*.tests", "*.tests.*"]

# ------------------------
# PYTEST
# ------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]

addopts = [
    "-q",
    "--strict-config",
    "--strict-markers",
    "--cov=agent_sandbox",
    "--cov-report=term-missing",
    "--no-cov-on-fail",
]

filterwarnings = ["error"]

# ------------------------
# RUFF (LINT + FORMAT)
# ------------------------

[tool.ruff]
line-length = 100
target-version = "py311"

# Only lint real code — avoids LICENSE / markdown issues
src = ["src", "tests"]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]

extend-exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "docs",
    "*.egg-info",
    "LICENSE",
    "CHANGELOG.md",
    "AGENTS.md",
    "README.md",
    "SECURITY.md",
    "CODING_PRACTICES.md",
]

[tool.ruff.lint]
select = [
    "B",   # bugbear
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "N",   # naming
    "S",   # security
    "SIM", # simplify
    "UP",  # pyupgrade
]

ignore = [
    "S603", # subprocess usage (expected in this tool)
    "S607", # partial path execution (docker/sops/security expected)
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "S101", # asserts are fine in tests
    "S106", # test secrets are fine
]

"src/agent_sandbox/constants.py" = [
    "S105", # constants may look like secrets
]

"src/agent_sandbox/doctor.py" = [
    "S105", # diagnostics may resemble secrets
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

# ------------------------
# BANDIT
# ------------------------

[tool.bandit]
exclude_dirs = ["tests", "build", "dist", "docs"]

skips = [
    "B105", # string may look like password
    "B310", # URL open usage
    "B404", # subprocess import
    "B603", # subprocess usage without shell (expected)
]
