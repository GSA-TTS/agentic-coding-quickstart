# spec.yaml — agentic-coding-playbook (an sbx mixin kit)
#
# Delivers the GSA agentic-coding-playbook (federal AGENTS.md rules + Agent
# Skills) into a sandbox. The kit ships NO content in files/: instead a startup
# command CLONES the playbook at a pinned ref and symlinks its AGENTS.md and
# skills into every supported agent's search paths. See README.md for why
# clone-at-startup (vs. a vendored copy or a files/ payload).
#
# Apply with:
#   sbx run --kit <path-to-this-kit> opencode <project>
#
# Behavior:
#   - caps.network: allow egress to GitHub so the clone can run.
#   - GitHub auth (while the playbook repo is PRIVATE): we do NOT declare a
#     `github` credential here. The built-in OPENCODE base sandbox kit already
#     declares one, and sbx composition rejects two kits declaring the same
#     credential service ("defined in both ..."). That base credential
#     (sentinel-swap proxy injection) authenticates the clone — we just
#     allow-list the egress below. The user supplies the token once via
#     `sbx secret set -g github`; the container never sees it. (If you apply this
#     kit on a base agent whose kit does NOT declare `github`, a private-repo
#     clone has no credential and will fail — degrading gracefully; make the repo
#     public or add a github credential via the base.) Once the repo is public,
#     no token is needed.
#   - environment.PLAYBOOK_REF: the pinned playbook ref (default: a release tag
#     baked at commit time). Override by editing this value and recreating —
#     sbx does NOT forward host env into startup commands.
#   - commands.startup: idempotent + NON-FATAL. Clones once (clone-if-missing,
#     no per-start refetch), links rules + skills, and on any failure warns and
#     exits 0 so the sandbox still starts (degrades to "no playbook"). Re-runs on
#     every start, so an offline create self-heals on a later start.
schemaVersion: "2"
kind: mixin
name: agentic-coding-playbook
displayName: Agentic Coding Playbook (federal rules + skills)
description: >
  Clones the GSA agentic-coding-playbook at a pinned ref at container startup
  and links its AGENTS.md and Agent Skills into each supported agent's search
  paths (OpenCode, Claude Code, Codex, Copilot, Cursor, Droid, Kiro, Docker
  Agent). Degrades gracefully (warns and continues) when the clone is
  unavailable; self-heals on a later start. Relies on the base sandbox's github
  credential for cloning while the playbook repo is private.

caps:
  network:
    allow:
      # git clone over HTTPS hits github.com; the smart-HTTP pack fetch for a
      # shallow clone is served from codeload.github.com. Pinned to the minimal
      # set; verify with `sbx policy log` (see README "Verifying"). Network
      # allow/deny lists union across kits, so listing github.com here does not
      # conflict with the base template (unlike credentials, which must not be
      # redeclared — see the GitHub auth note above).
      - github.com:443
      - codeload.github.com:443

environment:
  variables:
    # Pinned playbook ref. Bump this (and recreate sandboxes) to adopt a newer
    # playbook release. Keep in sync with the default in the startup script.
    PLAYBOOK_REF: "v0.12.1"

commands:
  startup:
    - description: Clone the playbook at the pinned ref and link rules + skills
      user: "1000"
      # StartupCommand.command is argv ([]string), so invoke a shell explicitly.
      command:
        - sh
        - -c
        - |
          # Idempotent + non-fatal. Never fail the sandbox start: on any error,
          # warn to stderr and exit 0 so the sandbox comes up without the
          # playbook (it self-heals on a later start once the clone can run).
          set -u
          ref="${PLAYBOOK_REF:-v0.12.1}"
          repo="https://github.com/GSA-TTS/agentic-coding-playbook.git"
          dir="$HOME/.agentic-coding-playbook"

          warn() { echo "agentic-coding-playbook: $*" >&2; }

          # 1) Clone once (clone-if-missing). A pinned --branch tag + --depth 1
          #    keeps it small and reproducible. No refetch on later starts.
          if [ ! -e "$dir/.git" ]; then
            if ! git clone --quiet --depth 1 --branch "$ref" "$repo" "$dir" 2>/dev/null; then
              warn "clone of $repo@$ref failed (offline, missing GitHub token, or bad ref?);"
              warn "  starting WITHOUT playbook rules/skills. Will retry on next start."
              warn "  Fix: ensure 'sbx secret set -g github' is set and network allows github.com."
              exit 0
            fi
          fi

          agents="$dir/AGENTS.md"
          skills="$dir/.agents/skills"
          if [ ! -f "$agents" ]; then
            warn "cloned, but AGENTS.md not found at $agents; skipping linking."
            exit 0
          fi

          # link_file TARGET SOURCE — symlink a file, creating parent dirs.
          link_file() {
            _t="$1"; _s="$2"
            [ -e "$_s" ] || return 0
            mkdir -p "$(dirname "$_t")" 2>/dev/null || return 0
            ln -sfn "$_s" "$_t" 2>/dev/null || warn "could not link $_t"
          }

          # link_skills_into ROOT — symlink each skill subdir under ROOT.
          link_skills_into() {
            _root="$1"
            [ -d "$skills" ] || return 0
            mkdir -p "$_root" 2>/dev/null || return 0
            for _sk in "$skills"/*/; do
              [ -d "$_sk" ] || continue
              ln -sfn "${_sk%/}" "$_root/$(basename "$_sk")" 2>/dev/null \
                || warn "could not link skill $(basename "$_sk") into $_root"
            done
          }

          # 2) AGENTS.md per agent. Agents with a known user-level rules path:
          #    OpenCode + Codex + Droid read a literal AGENTS.md; Claude expects
          #    CLAUDE.md; Copilot expects copilot-instructions.md. Cursor, Kiro,
          #    and Docker Agent have no user-level rules FILE convention (rules
          #    live in app settings / agent YAML), so they are skills-only.
          link_file "$HOME/.config/opencode/AGENTS.md"          "$agents"  # OpenCode
          link_file "$HOME/.codex/AGENTS.md"                    "$agents"  # Codex
          link_file "$HOME/.factory/AGENTS.md"                  "$agents"  # Droid (Factory.ai)
          link_file "$HOME/.claude/CLAUDE.md"                   "$agents"  # Claude Code
          link_file "$HOME/.copilot/copilot-instructions.md"    "$agents"  # GitHub Copilot CLI

          # 3) Skills. ~/.agents/skills is the cross-agent standard root
          #    (Codex, OpenCode, Docker Agent, Copilot). Per-agent roots follow
          #    for agents that only scan their own dir.
          link_skills_into "$HOME/.agents/skills"      # standard (multi-agent)
          link_skills_into "$HOME/.claude/skills"      # Claude Code (+ compat)
          link_skills_into "$HOME/.factory/skills"     # Droid (Factory.ai)
          link_skills_into "$HOME/.cursor/skills"      # Cursor
          link_skills_into "$HOME/.copilot/skills"     # GitHub Copilot CLI

          exit 0
