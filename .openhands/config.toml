# OpenHands provider configuration — USAi
#
# NOTE: OpenHands V1 (the GUI / agent-server image used by `make run-openhands`)
# does NOT read this file. V1 stores its runtime configuration in
# ~/.openhands/settings.json, which `make run-openhands` seeds automatically via
# scripts/seed-openhands-settings.sh.
#
# This file is kept as documentation of the intended USAi provider settings and
# for users running the legacy (V0) `config.toml`-based OpenHands runtime.
#
# The API key is injected at runtime from the OPENAI_API_KEY environment
# variable (exported from your USAi key). It is never stored in this file.

[core]
# Default agent to use for coding tasks
default_agent = "CodeActAgent"

# Maximum iterations for agent tasks
max_iterations = 100

[llm]
# USAi-compatible endpoint. The `openai/` model prefix tells LiteLLM to use the
# OpenAI-compatible chat-completions API format that USAi exposes.
model = "openai/gpt-5.4-latest-guardrails-defaultv2"
base_url = "https://api.gsa.usai.gov/api/v1"
# API key is read from the OPENAI_API_KEY environment variable at runtime.
api_key_env = "OPENAI_API_KEY"
