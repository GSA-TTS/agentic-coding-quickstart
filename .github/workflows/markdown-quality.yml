name: Markdown Quality

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.markdownlint.jsonc'
      - '.markdownlintignore'
      - '.markdown-link-check.json'
      - '.github/linters/package*.json'
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - '.markdownlint.jsonc'
      - '.markdownlintignore'
      - '.markdown-link-check.json'
      - '.github/linters/package*.json'

concurrency:
  group: markdown-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '.github/linters/package-lock.json'

      - name: Install linter dependencies
        working-directory: .github/linters
        run: |
          npm ci
          npm audit --audit-level=high

      # File selection comes from the same command used by `npm run lint:md` and
      # pre-commit, so none of the three can select a different set. The version
      # comes from .github/linters/package-lock.json (installed above), so there
      # is no second version pin to drift.
      #
      # --dot is required: markdownlint's globber skips dot-directories by
      # default, which silently excluded .github/**/*.md (e.g.
      # .github/pull_request_template.md) from every invocation.
      - name: Run markdownlint
        shell: bash
        run: |
          set -euo pipefail
          .github/linters/node_modules/.bin/markdownlint --config .markdownlint.jsonc --ignore-path .markdownlintignore --dot "**/*.md"

      # A markdownlint run that matched no files can still exit 0, so assert the
      # repository has tracked markdown files after applying .markdownlintignore.
      #
      # The ignore set is evaluated by GIT's gitignore engine via --exclude-from,
      # not by hand-translating .markdownlintignore into `:!` pathspecs. Those are
      # different matchers: a bare `test/vendor` pathspec matches only that exact
      # path, so a naive translation left vendored files in the count and the
      # assertion drifted above the set markdownlint actually linted. Reusing the
      # same gitignore semantics markdownlint applies keeps them in agreement.
      - name: Assert markdownlint actually linted files
        shell: bash
        run: |
          set -euo pipefail
          total=$(git ls-files -- '*.md' | wc -l | tr -d ' ')
          ignored=$(git ls-files -c -i --exclude-from=.markdownlintignore -- '*.md' | wc -l | tr -d ' ')
          count=$((total - ignored))
          echo "markdownlint linted ${count} file(s) (${total} tracked, ${ignored} ignored)"
          if [ "${count}" -lt 1 ]; then
            echo "::error::markdownlint matched no files - check .markdownlintignore" >&2
            exit 1
          fi

  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true  # External URLs can be flaky
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select markdown files
        id: link-check-files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin main --depth=1
            git diff --name-only --diff-filter=AM origin/main -- \
              '*.md' ':!CHANGELOG.md' > /tmp/markdown-link-check-files
          else
            git ls-files -- '*.md' ':!CHANGELOG.md' > /tmp/markdown-link-check-files
          fi

          {
            echo 'files<<EOF'
            sed 's#^#./#' /tmp/markdown-link-check-files | tr '\n' ',' | sed 's/,$//'
            echo
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tcort/github-action-markdown-link-check@e047c5b37f24ab722bbef1a27b6fab7f96bc4068 # v1.1.3
        if: steps.link-check-files.outputs.files != ''
        with:
          config-file: ".markdown-link-check.json"
          use-quiet-mode: "yes"
          folder-path: "."
          check-modified-files-only: "no"
          base-branch: "main"
          file-extension: ".markdown-link-check-disabled"
          file-path: ${{ steps.link-check-files.outputs.files }}
