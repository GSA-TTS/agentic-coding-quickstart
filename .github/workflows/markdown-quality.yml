name: Markdown Quality

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.markdownlint-cli2.yaml'
      - '.markdown-link-check.json'
      - '.github/linters/package*.json'
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - '.markdownlint-cli2.yaml'
      - '.markdown-link-check.json'
      - '.github/linters/package*.json'

concurrency:
  group: markdown-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '.github/linters/package-lock.json'

      - name: Install linter dependencies
        working-directory: .github/linters
        run: |
          npm ci
          npm audit --audit-level=high

      # No glob arguments: file selection comes from .markdownlint-cli2.yaml, the
      # same source the pre-commit hook and `npm run lint:md` read, so none of the
      # three can select a different set. The version comes from
      # .github/linters/package-lock.json (installed above), so there is no second
      # version pin to drift.
      # A markdownlint-cli2 run that matched no files still exits 0, so assert the
      # file count is non-zero from the same output instead of running the linter
      # a second time.
      - name: Run markdownlint
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          set +e
          npx --prefix .github/linters markdownlint-cli2 2>&1 | tee "$output"
          lint_rc=${PIPESTATUS[0]}
          set -e

          count=$(sed -n 's/^Linting: \([0-9]\{1,\}\) file.*/\1/p' "$output")
          echo "markdownlint linted ${count:-0} file(s)"
          if [ "$lint_rc" -ne 0 ]; then
            exit "$lint_rc"
          fi
          if [ "${count:-0}" -lt 1 ]; then
            echo "::error::markdownlint matched no files - check globs in .markdownlint-cli2.yaml" >&2
            exit 1
          fi

  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true  # External URLs can be flaky
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select markdown files
        id: link-check-files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin main --depth=1
            git diff --name-only --diff-filter=AM origin/main -- \
              '*.md' ':!CHANGELOG.md' > /tmp/markdown-link-check-files
          else
            git ls-files -- '*.md' ':!CHANGELOG.md' > /tmp/markdown-link-check-files
          fi

          {
            echo 'files<<EOF'
            sed 's#^#./#' /tmp/markdown-link-check-files | tr '\n' ',' | sed 's/,$//'
            echo
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tcort/github-action-markdown-link-check@e047c5b37f24ab722bbef1a27b6fab7f96bc4068 # v1.1.3
        if: steps.link-check-files.outputs.files != ''
        with:
          config-file: ".markdown-link-check.json"
          use-quiet-mode: "yes"
          folder-path: "."
          check-modified-files-only: "no"
          base-branch: "main"
          file-extension: ".markdown-link-check-disabled"
          file-path: ${{ steps.link-check-files.outputs.files }}
