name: Markdown Quality

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.markdownlint.jsonc'
      - '.markdownlintignore'
      - '.markdown-link-check.json'
      - '.github/linters/**'
      - '.github/workflows/markdown-quality.yml'
      - '.pre-commit-config.yaml'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - '.markdownlint.jsonc'
      - '.markdownlintignore'
      - '.markdown-link-check.json'
      - '.github/linters/**'
      - '.github/workflows/markdown-quality.yml'
      - '.pre-commit-config.yaml'
      - 'package.json'

concurrency:
  group: markdown-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '.github/linters/package-lock.json'

      - name: Install linter dependencies
        working-directory: .github/linters
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Test Markdown adapter
        run: npm run test:markdownlint

      # The wrapper shares selection, config and engine with npm and pre-commit,
      # including hidden Markdown and fail-closed empty selection (ADR-0046).
      - name: Run markdownlint
        shell: bash
        run: |
          set -euo pipefail
          node .github/linters/run-markdownlint.mjs

      # Count the actual lexical selection, not a separate tracked-file estimate.
      - name: Assert markdownlint actually linted files
        shell: bash
        run: |
          set -euo pipefail
          count=$(node .github/linters/run-markdownlint.mjs --count-only)
          echo "markdownlint linted ${count} file(s)"

  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true  # External URLs can be flaky
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select markdown files
        id: link-check-files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin main --depth=1
            git diff --name-only --diff-filter=AM origin/main -- \
              '*.md' ':!CHANGELOG.md' > /tmp/markdown-link-check-files
          else
            git ls-files -- '*.md' ':!CHANGELOG.md' > /tmp/markdown-link-check-files
          fi

          {
            echo 'files<<EOF'
            sed 's#^#./#' /tmp/markdown-link-check-files | tr '\n' ',' | sed 's/,$//'
            echo
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tcort/github-action-markdown-link-check@e047c5b37f24ab722bbef1a27b6fab7f96bc4068 # v1.1.3
        if: steps.link-check-files.outputs.files != ''
        with:
          config-file: ".markdown-link-check.json"
          use-quiet-mode: "yes"
          folder-path: "."
          check-modified-files-only: "no"
          base-branch: "main"
          file-extension: ".markdown-link-check-disabled"
          file-path: ${{ steps.link-check-files.outputs.files }}
