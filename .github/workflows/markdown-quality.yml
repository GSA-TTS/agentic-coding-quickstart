name: Markdown Quality

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.markdownlint-cli2.yaml'
      - '.markdown-link-check.json'
      - '.github/linters/package*.json'
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - '.markdownlint-cli2.yaml'
      - '.markdown-link-check.json'
      - '.github/linters/package*.json'

concurrency:
  group: markdown-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '.github/linters/package-lock.json'

      - name: Install linter dependencies
        working-directory: .github/linters
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Run markdownlint
        run: npx --prefix .github/linters markdownlint-cli2 "**/*.md" "#node_modules" "#.github/linters/node_modules" "#CHANGELOG.md"

  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true  # External URLs can be flaky
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: tcort/github-action-markdown-link-check@e7c7a18363c842693fadde5d41a3bd3573a7a225 # v1.1.2
        with:
          config-file: ".markdown-link-check.json"
          use-quiet-mode: "yes"
          folder-path: "."
