# Release assets include an offline, exact-hash validator wheelhouse for each
# supported host. Runtime creation never downloads Python packages.
#
# RELEASES ARE UPSTREAM'S JOB. This fork cuts none: the acq v1 rewrite merges into
# GSA-TTS/agentic-coding-quickstart, and upstream's release-please numbers it there,
# so upstream users keep an unbroken SemVer line. A fork release would be a second,
# conflicting version line for the same tool -- and the fork carries no release tags,
# so release-please here walks all history and proposes a *downgrade*.
#
# Every job below is therefore gated on `vars.ENABLE_RELEASES == 'true'`, a
# repository variable that is unset on the fork. The workflow stays in place,
# exercised by its own structure and by the Tier-3 gate's own workflow, and is what
# gets contributed upstream; upstream sets the variable (or drops the condition).
# See docs/howto/release-gate-setup.md.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # release-please is split in two so the Tier-3 gate can sit between the release PR
  # and the tag/Release it would otherwise create in the same step (ADR-0044m).
  #
  #   release-pr   keeps the release PR up to date, always (skip-github-release)
  #   tier3-gate   every claimed cell holds a current green transcript or a waiver
  #   release-tag  creates the tag and the GitHub Release (skip-github-pull-request)
  #
  # A failing gate therefore leaves no tag and no Release, only an open release PR
  # carrying a red check. Gating only the asset jobs would be an illusion: the
  # Release would already be published by the time they ran.
  release-pr:
    name: Release PR
    if: ${{ vars.ENABLE_RELEASES == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # RELEASE_PLEASE_TOKEN (a PAT or GitHub App token) is optional but
          # recommended: a release PR opened with the default GITHUB_TOKEN does not
          # trigger pull_request workflows, so the Tier-3 release gate never reports
          # on the release PR and cannot be a required check. With the fallback,
          # Settings > Actions > General > "Allow GitHub Actions to create and
          # approve pull requests" must be enabled.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  # Evaluated from the committed ledger alone (docs/qualification-ledger.json), so no
  # live backend run happens here and the job needs no credentials.
  tier3-gate:
    name: Tier-3 release gate (release)
    if: ${{ vars.ENABLE_RELEASES == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the gate diffs each transcript's recorded revision against
          # HEAD to see whether the Tier-3 surface changed since it was recorded.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Evaluate the gate
        run: |
          rc=0
          python -m qualification.gate check > gate.md 2>&1 || rc=$?
          cat gate.md
          {
            echo '### Tier-3 release gate'
            echo
            cat gate.md
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  release-tag:
    name: Release Tag
    needs: tier3-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Tagging needs more than `contents`: after creating the Release,
      # release-please comments on the release PR and swaps its
      # `autorelease: pending` label for `autorelease: tagged`. Without write
      # access to those, the Release is published and the job then fails, leaving
      # it with no assets. (A PAT in RELEASE_PLEASE_TOKEN bypasses these job
      # permissions, so the gap only appears on the default-token path.)
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  build-assets:
    needs: release-tag
    if: ${{ vars.ENABLE_RELEASES == 'true' && needs.release-tag.outputs.release_created == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-assets.yml
    with:
      ref: ${{ needs.release-tag.outputs.tag_name }}
      sign: true
    secrets:
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_CERTIFICATE_PROFILE: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

  publish:
    needs: [release-tag, build-assets]
    if: ${{ vars.ENABLE_RELEASES == 'true' && needs.release-tag.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: ${{ vars.ENABLE_COSIGN_SIGNING == 'true' && github.event_name != 'pull_request' }}
        with:
          cosign-release: v3.1.4
      - name: Sign checksums (Sigstore keyless)
        if: ${{ vars.ENABLE_COSIGN_SIGNING == 'true' && github.event_name != 'pull_request' }}
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/**/*'
      - name: Upload every attested asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-tag.outputs.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
