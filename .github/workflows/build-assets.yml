# Dry-run contract (ADR-0042m): build and verify the complete offline asset set.
# Only workflow artifacts are uploaded; this workflow never tags or publishes.
name: Build assets (dry run)

on:
  workflow_dispatch:
  workflow_call:
  # Run the dry run on changes to what it builds, so packaging regressions show
  # up on the pull request rather than at release time.
  pull_request:
    paths:
      - .github/workflows/build-assets.yml
      - installer/**
      - install.sh
      - install.ps1
      - scripts/assemble-release
      - scripts/gen-install-assets
      - scripts/gen-provenance
      - scripts/stage-posix-runtime
      - scripts/stage-windows-runtime
      - scripts/provider-input-validator-requirements-*.txt
      - py-acq/src/acq_py/version_info.py

concurrency:
  group: build-assets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            pip_platform: manylinux_2_17_x86_64
            lock: scripts/provider-input-validator-requirements-linux.txt
            python_versions: "312"
            runtime_url: https://github.com/astral-sh/python-build-standalone/releases/download/20261026/cpython-3.14.10%2B20261026-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz
            runtime_sha256: 4d3c16c59ed0802a3d1d34d8bce504b15ceeaff39d62dadecc6a9fa803412aed
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            pip_platform: manylinux_2_17_aarch64
            lock: scripts/provider-input-validator-requirements-linux.txt
            python_versions: "312"
            runtime_url: https://github.com/astral-sh/python-build-standalone/releases/download/20261026/cpython-3.14.10%2B20261026-aarch64-unknown-linux-gnu-install_only_stripped.tar.gz
            runtime_sha256: 90f48337bc3dd4ae6eda81e001e4c981236d403b6b5a07778bbdf94ee423dc00
          - platform: macos-arm64
            runner: macos-15
            pip_platform: macosx_11_0_arm64
            lock: scripts/provider-input-validator-requirements-macos.txt
            python_versions: "312 313 314"
            runtime_url: https://github.com/astral-sh/python-build-standalone/releases/download/20261026/cpython-3.14.10%2B20261026-aarch64-apple-darwin-install_only_stripped.tar.gz
            runtime_sha256: 95eb8c87d16af37c54e9765e31d8c56c0d8ffa9968ea0f704f73a9b83f84e9f9
          - platform: macos-x86_64
            runner: macos-15-intel
            pip_platform: macosx_10_13_x86_64
            lock: scripts/provider-input-validator-requirements-macos.txt
            python_versions: "312 313 314"
            runtime_url: https://github.com/astral-sh/python-build-standalone/releases/download/20261026/cpython-3.14.10%2B20261026-x86_64-apple-darwin-install_only_stripped.tar.gz
            runtime_sha256: 2fd8becd48cf0ff5f0a15df3c0db7cae7aa708dcaacf901bd30d6cdd6229370b
          - platform: windows-x86_64
            runner: windows-2022
            pip_platform: win_amd64
            lock: scripts/provider-input-validator-requirements-windows.txt
            python_versions: "312"
            runtime_url: https://www.python.org/ftp/python/3.14.10/python-3.14.10-embed-amd64.zip
            runtime_sha256: 90905e64a840557d8c1bc4f5b74db3d7ee85e3ffb217611cac1c7813acea4159
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build exact-hash validator wheelhouse
        run: |
          set -euo pipefail
          for py in ${{ matrix.python_versions }}; do
            python3 -I -m pip download --only-binary=:all: --require-hashes \
              --requirement "${{ matrix.lock }}" --platform "${{ matrix.pip_platform }}" \
              --implementation cp --python-version "$py" --abi "cp$py" --dest wheelhouse
          done
          (cd wheelhouse && python3 -I -c "import hashlib,pathlib; print(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in sorted(pathlib.Path('.').glob('*.whl'))), end='')" > SHA256SUMS)
      - name: Fetch and verify pinned runtime, then assemble
        env:
          RUNTIME_URL: ${{ matrix.runtime_url }}
          RUNTIME_SHA256: ${{ matrix.runtime_sha256 }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error "$RUNTIME_URL" -o runtime.archive
          # The matching stage script verifies the pinned digest before extraction.
          scripts/assemble-release "$PLATFORM" runtime.archive "$RUNTIME_SHA256" wheelhouse dist
      - name: Smoke-test the runtime and baked identity from the unpacked archive
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir unpacked
          if [ "$PLATFORM" = windows-x86_64 ]; then
            python3 -I -m zipfile -e dist/acq-windows-x64.zip unpacked
            unpacked/py-acq/runtime/python.exe -I -m acq_py version --json > version.json
          else
            tar -xzf dist/*.tar.gz -C unpacked
            unpacked/py-acq/runtime/bin/python3 -I -c 'import pathlib,runpy,sys; sys.path.insert(0,str(pathlib.Path("unpacked/py-acq/src").resolve())); sys.argv=["acq_py","version","--json"]; runpy.run_module("acq_py",run_name="__main__")' > version.json
          fi
          python3 -I -c 'import json,subprocess; d=json.load(open("version.json"))["data"]; assert d["impl"]=="python"; assert d["acq_version"]==json.load(open("package.json"))["version"]; assert d["source_revision"]==subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(), d'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  assemble:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist
      - name: Complete and verify the enumerated dist
        run: |
          cp install.sh install.ps1 dist/
          scripts/gen-provenance dist
          scripts/gen-install-assets dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  verify-install:
    needs: assemble
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Offline install and installed identity (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          sh dist/install.sh --source "$PWD/dist" --install-dir "$RUNNER_TEMP/acq-installed" --bin-dir "$RUNNER_TEMP/acq-bin" --yes
          ACQ_IMPL=python "$RUNNER_TEMP/acq-installed/acq" version --json > version.json
          python3 -I -c 'import json; d=json.load(open("version.json"))["data"]; assert d["impl"]=="python"; assert d["acq_version"]==json.load(open("package.json"))["version"], d'
      - name: Offline install and installed identity (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./dist/install.ps1 -Source "$PWD/dist" -InstallDir "$env:RUNNER_TEMP/acq-installed"
          $data = (& "$env:RUNNER_TEMP/acq-installed/acq.cmd" version --json | ConvertFrom-Json).data
          if ($LASTEXITCODE -ne 0) { throw 'installed launcher failed' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($data.impl -ne 'python' -or $data.acq_version -ne $version) { throw 'installed identity mismatch' }
