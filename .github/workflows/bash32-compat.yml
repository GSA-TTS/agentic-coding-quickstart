# bash 3.2 compatibility gate — runs the acq offline suite under bash 3.2.57.
#
# Why this exists:
#   The macOS system bash is 3.2.57 (Apple's last GPLv2 bash), so it is the
#   PRIMARY dev/CI target for anyone on a Mac. bash 3.2 treats expanding an
#   empty array under `set -u` (`"${arr[@]}"`) as an unbound-variable error and
#   aborts — bash 4.4+ does not. That class of bug is INVISIBLE to the existing
#   lanes, which all run on ubuntu-latest (bash 5.x). This gate reproduces the
#   3.2 interpreter so the class is caught pre-merge instead of only when someone
#   runs the suite locally on a Mac.
#
#   The suite runs under bats-core (ADR-0025); bats supports bash 3.2.57, and the
#   acq code + stub library it exercises are the 3.2 target. We invoke the
#   vendored bats runner (test/vendor/bats-core) with the 3.2 interpreter as
#   $BATS_SHELL so the @tests — and the acq/adapters they drive — run on 3.2.
#
# Why build 3.2.57 from source instead of a bash:3.2 container:
#   - 3.2.57 built against glibc on the runner is the exact version macOS ships;
#     the docker `bash:3.2` image is musl (aarch64-unknown-linux-musl), a
#     different libc, and a digest-pinned image is content-pinned but not
#     signer-authenticated (see ADR-0039, which also records why the
#     Docker-Hub fetch in scripts/fetch-bash32-oci.py is a local-dev
#     convenience and not used here).
#   - The suite needs real git + python3 + coreutils (git-identity, GitHub
#     down-scoping, and the AF_UNIX socket tests). ubuntu-latest already has all
#     three, so nothing is stubbed/SKIPped; the Alpine image would need a
#     network `apk add`.
#
# Shape of the run (ADR-0039): `changes` -> `prepare-bash32` (builds or
# restores the interpreter ONCE and publishes it as a sha256-verified run
# artifact) -> `test-acq-bash32` (a matrix of shard legs, each running its share
# of test/bats under that interpreter) -> `gate` (the required check).
#
# Supply-chain: the source tarball is authenticated with GNU's detached OpenPGP
# signature, trust-anchored to Chet Ramey's release-signing key by full
# fingerprint (see BASH_SIGNING_KEY_FPR). This authenticates the SIGNER, not
# just the bytes, and fails closed if the key can't be imported by fingerprint.
#
# Why a separate, non-default workflow (not part of pre-commit):
#   3.2-specific regressions are relatively rare and the build adds time, so the
#   expensive job is NOT run on every PR — only when it's relevant (see the
#   `changes` job below). It runs as a REQUIRED PR check so the feedback lands
#   before merge without slowing the common path.
#
# Why this workflow has NO top-level `paths:` filter (fixed 2026-09-24):
#   A workflow-level `paths:` filter suppresses the check-run ENTIRELY for a
#   non-matching PR — GitHub creates no status at all for that context, not a
#   "skipped, passing" one. Branch protection's required-status-checks list has
#   no path awareness of its own, so a required context that's structurally
#   never created sits "Expected"/pending forever and blocks merge — even when
#   every check that DID run is green. This hit a dependabot actions-version
#   bump touching only .github/workflows/release.yml and blocked its merge.
#   This is GitHub's own documented failure mode for "required check backed by a
#   path-filtered workflow" (see "Handling skipped but required checks" in
#   GitHub's required-status-checks troubleshooting docs) and the fix below is
#   its documented mitigation: the workflow now always triggers; a cheap
#   `changes` job computes relevance via `git diff` (same technique
#   markdown-quality.yml already uses, so no new tooling); the expensive
#   interpreter-build job runs only when relevant; and an always-on `gate` job
#   turns that conditional result into an unconditional status so the SAME
#   required-check name ("acq offline suite under bash 3.2") keeps getting
#   posted on every PR and merge group — skipped-and-green when irrelevant, real-result when
#   relevant. Keeping the required-check name unchanged (rather than renaming it
#   to something like "bash 3.2 compat gate") means this fix needs zero
#   out-of-band branch-protection/ruleset changes: the same context that was
#   already required just starts actually posting on every PR instead of only
#   some.
#   The gate is deliberately fail-closed on its OWN dependency chain, not just
#   the expensive job's result: it treats a FAILURE of the cheap `changes` job
#   itself (e.g. the diff computation errors) as a gate failure, not a silent
#   skip-to-green — an error in path detection must not be indistinguishable
#   from "nothing relevant changed".

name: bash 3.2 compat

on:
  pull_request:
    branches:
      - main
  merge_group:
    branches: [main]

concurrency:
  group: bash32-compat-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Apple's last GPLv2 bash; matches the macOS system-bash version string
  # (3.2.57(1)-release).
  BASH32_VERSION: "3.2.57"
  # Supply-chain integrity: rather than pin a SHA-256, verify GNU's detached
  # OpenPGP signature (bash-<v>.tar.gz.sig) against the tarball. Trust is
  # anchored to Chet Ramey's release-signing key by its FULL 40-hex fingerprint
  # (a stable, published value) — a keyserver can only satisfy this import if it
  # returns that exact key, so a substituted key fails closed. This is stronger
  # than a bare checksum: it authenticates the signer, not just the bytes.
  # Chet Ramey <chet@case.edu> — https://tiswww.case.edu/php/chet/
  BASH_SIGNING_KEY_FPR: "7C0135FB088AAF6C66C650B9BB5869F064EA74AB"

jobs:
  # Cheap relevance check: does the PR or merge-group diff touch anything the bash 3.2
  # interpreter-build + acq-offline-suite job actually needs to re-verify?
  # Mirrors the path list the old workflow-level `paths:` filter encoded.
  # Uses a plain `git diff --name-only`, matching the existing in-repo
  # precedent in markdown-quality.yml's link-check job, rather than adding a
  # marketplace paths-filter action — consistent with this repo's minimal-
  # third-party-action / exact-SHA-pin culture.
  changes:
    name: Determine bash 3.2 relevance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute relevance from the PR or merge-group diff
        id: filter
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Fail CLOSED on any error in this step: if the diff can't be
          # computed for any reason, fail rather than silently skipping the
          # real check. An error here must surface as a
          # job FAILURE (caught by the gate below), never as a quiet
          # relevant=false. Shallow-fetch just the base commit (mirrors
          # markdown-quality.yml's link-check job) rather than the whole
          # history — cheaper, and `git diff <sha> -- <paths>` only needs that
          # one commit to be present locally, not a merge-base walk.
          if [[ ! "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::event did not supply a valid base commit SHA."
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA" -- \
            'acq' \
            'acq.backends' \
            'scripts/test-acq-lib.sh' \
            'scripts/test-acq-bats' \
            'scripts/bats-shard' \
            'scripts/summarize-bats-timing' \
            'scripts/test-acq-bash32' \
            'scripts/scan-heredoc-subst.py' \
            'scripts/fetch-bash32-oci.py' \
            'test/bats' \
            '.github/workflows/bash32-compat.yml')"
          if [ -n "$changed" ]; then
            echo "relevant=true" >>"$GITHUB_OUTPUT"
            echo "Relevant paths changed:"
            printf '  %s\n' "$changed"
          else
            echo "relevant=false" >>"$GITHUB_OUTPUT"
            echo "No bash-3.2-relevant paths changed; the interpreter build + offline suite will be skipped."
          fi

  # Provide the bash 3.2.57 interpreter ONCE per run, for all shard legs.
  # This job is the only one that touches the actions/cache entry (so there is
  # no concurrent-save race) and the only one that can compile: it restores the
  # cached build or builds from source with the OpenPGP-verified tarball, then
  # packs /opt/bash32 into a tarball and hands THAT to the legs as a run
  # artifact, with its sha256 as a job output. A failed upload fails this job,
  # and a leg that cannot download or verify the tarball fails closed; no leg
  # ever falls back to another bash. Why a source build and not the Docker Hub
  # bash:3.2.57 image, and why an artifact and not a per-leg cache restore:
  # docs/adr/0039-bash32-ci-shard-matrix-and-interpreter-handoff.md.
  prepare-bash32:
    name: Prepare bash 3.2.57 interpreter
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cache the built interpreter so the compile only happens on a version bump.
      - id: cache-bash32
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/bash32
          key: bash32-${{ runner.os }}-${{ env.BASH32_VERSION }}

      - name: Build bash ${{ env.BASH32_VERSION }} from source
        if: steps.cache-bash32.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          tarball="bash-${BASH32_VERSION}.tar.gz"
          # Fetch the tarball + its detached signature. `ftp.gnu.org` is a single
          # host that intermittently refuses connections and red-flags healthy
          # PRs (curl 28 "Failed to connect"). Try multiple HTTPS GNU mirrors
          # before failing; integrity does not depend on the source — the OpenPGP
          # signature below authenticates the bytes regardless of which mirror
          # served them.
          fetch() {
            # $1 = output path, $2 = path under /gnu/bash
            local _out="$1" _path="$2" _m
            for _m in \
              https://ftpmirror.gnu.org/gnu/bash \
              https://mirrors.kernel.org/gnu/bash \
              https://mirrors.ocf.berkeley.edu/gnu/bash \
              https://mirrors.mit.edu/gnu/bash \
              https://ftp.gnu.org/gnu/bash ; do
              if curl -fsSL --connect-timeout 20 --retry 2 --retry-connrefused \
                   -o "$_out" "${_m}/${_path}"; then
                return 0
              fi
              echo "warn: fetch of ${_path} from ${_m} failed; trying next mirror" >&2
            done
            echo "::error::could not download ${_path} from any GNU mirror" >&2
            return 1
          }
          fetch "$tarball"       "$tarball"
          fetch "${tarball}.sig" "${tarball}.sig"

          # Authenticate the tarball via GNU's detached OpenPGP signature.
          # Trust is anchored to Chet Ramey's release-signing key by its full
          # 40-hex fingerprint: import the vendored key, then verify its
          # fingerprint matches exactly before trusting any signature.
          export GNUPGHOME
          GNUPGHOME="$(mktemp -d)"
          gpg --batch --import .github/keys/chet-ramey-bash-release-signing-key.asc
          got_fpr="$(gpg --batch --with-colons --fingerprint "$BASH_SIGNING_KEY_FPR" \
                      | awk -F: '$1=="fpr"{print $10; exit}')"
          if [ "$got_fpr" != "$BASH_SIGNING_KEY_FPR" ]; then
            echo "::error::vendored bash signing key fingerprint mismatch: ${got_fpr:-<none>}" >&2
            exit 1
          fi
          # Fail closed unless the signature verifies against that exact key.
          gpg --batch --verify "${tarball}.sig" "$tarball"

          tar -xzf "$tarball"
          cd "bash-${BASH32_VERSION}"
          # bash 3.2.57 (2007) predates modern GCC defaults; relax the two
          # errors-by-default (implicit function/int) so it configures & builds.
          CFLAGS="-Wno-implicit-function-declaration -Wno-implicit-int" \
            ./configure --prefix=/opt/bash32
          make -j"$(nproc)"
          make install

      - name: Confirm interpreter is exactly bash ${{ env.BASH32_VERSION }}
        run: |
          set -euo pipefail
          /opt/bash32/bin/bash --version | head -1
          got="$(/opt/bash32/bin/bash -c 'printf %s "${BASH_VERSION%%(*}"')"
          [ "$got" = "$BASH32_VERSION" ] || { echo "::error::interpreter reports $got, need $BASH32_VERSION" >&2; exit 1; }

      # upload-artifact does not preserve file modes, so ship a tarball.
      - name: Pack the interpreter
        id: pack
        run: |
          set -euo pipefail
          tar -C /opt/bash32 -czf "$RUNNER_TEMP/bash32.tar.gz" .
          sha="$(sha256sum "$RUNNER_TEMP/bash32.tar.gz" | awk '{print $1}')"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "bash32.tar.gz sha256: $sha"

      - name: Publish the interpreter for the shard legs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bash32-interpreter
          path: ${{ runner.temp }}/bash32.tar.gz
          if-no-files-found: error
          # Not keyed by run_attempt: "re-run failed jobs" re-runs only the legs
          # and must still find this attempt-1 artifact (its sha256 output is
          # preserved too). Short retention; after it expires a leg fails closed
          # and a full re-run rebuilds it.
          retention-days: 2
          overwrite: true

  # The real check: run the acq offline suite under the prepared bash 3.2.57,
  # split across a matrix of shards. scripts/bats-shard picks each shard's files
  # from test/bats at run time, so new test files are included automatically; the
  # shard count is the length of `matrix.shard` and every leg derives "I/N" from
  # it, so there is no second number to keep in sync. Legs are named
  # "... (build N/M)" — deliberately NOT the required context — and `gate`
  # (below) aggregates them. Only runs when `changes` found a relevant diff.
  # Renamed from the required-check name (which lives on `gate`) to avoid two
  # jobs in one run racing to post the same context.
  test-acq-bash32:
    name: acq offline suite under bash 3.2 (build ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [changes, prepare-bash32]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # Distinct per leg: labels the timing summary and names its artifact.
      ACQ_SHARD_ID: ${{ matrix.shard }}of${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The suite runs under bats-core, vendored as submodules.
          submodules: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Download the prepared interpreter
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bash32-interpreter
          path: ${{ runner.temp }}/bash32-dl

      # Fail closed: the tarball must match the digest prepare-bash32 computed,
      # and the extracted interpreter must report exactly 3.2.57.
      - name: Install and confirm bash ${{ env.BASH32_VERSION }}
        env:
          EXPECTED_SHA256: ${{ needs.prepare-bash32.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::prepare-bash32 supplied no valid sha256" >&2; exit 1; }
          tarball="$RUNNER_TEMP/bash32-dl/bash32.tar.gz"
          echo "$EXPECTED_SHA256  $tarball" | sha256sum --check --strict -
          # /opt is root-owned on hosted runners; same /opt/bash32 layout as the build.
          sudo mkdir -p /opt/bash32
          sudo chown "$(id -u):$(id -g)" /opt/bash32
          tar -xzf "$tarball" -C /opt/bash32
          /opt/bash32/bin/bash --version | head -1
          got="$(/opt/bash32/bin/bash -c 'printf %s "${BASH_VERSION%%(*}"')"
          [ "$got" = "$BASH32_VERSION" ] || { echo "::error::interpreter reports $got, need $BASH32_VERSION" >&2; exit 1; }

      # acq invokes the released Patterns validator during provider-input
      # projection. Install and select setup-python's exact runtime; bash's PATH
      # changes must not silently fall back to Ubuntu's system jsonschema.
      - name: Install Patterns provider-input validator dependencies
        run: |
          "$pythonLocation/bin/python" -m pip install --require-hashes --requirement scripts/provider-input-validator-requirements-linux.txt
          printf 'ACQ_PROVIDER_INPUT_PYTHON=%s\n' "$pythonLocation/bin/python" >> "$GITHUB_ENV"

      - name: Check out pinned Patterns validator contract
        run: |
          set -euo pipefail
          patterns_ref=$(sed -n 's/^PATTERNS_KIT_REF="\([0-9a-f]\{40\}\)"$/\1/p' acq.backends/common.sh)
          [ -n "$patterns_ref" ]
          patterns_dir="$RUNNER_TEMP/agentic-coding-patterns"
          git -C "$RUNNER_TEMP" init -q agentic-coding-patterns
          git -C "$patterns_dir" remote add origin https://github.com/GSA-TTS/agentic-coding-patterns.git
          git -C "$patterns_dir" fetch -q --depth 1 origin "$patterns_ref"
          git -C "$patterns_dir" checkout -q --detach FETCH_HEAD
          [ "$(git -C "$patterns_dir" rev-parse HEAD)" = "$patterns_ref" ]
          test -z "$(git -C "$patterns_dir" status --porcelain)"
          chmod -R a-w "$patterns_dir"

      - name: Run acq offline suite under bash 3.2 (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        env:
          ACQ_TEST_PATTERNS_REPO: ${{ runner.temp }}/agentic-coding-patterns
          ACQ_TEST_PROVIDER_INPUT_PYTHON: ${{ env.pythonLocation }}/bin/python
          ACQ_BATS_TIMING: '1'
          ACQ_BATS_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        # Put the 3.2 interpreter first on PATH so bats' `#!/usr/bin/env bash`
        # shebangs — and the acq/adapters the @tests drive — all resolve to
        # bash 3.2.57. bats-core supports >= 3.2 (its own bin/bats guards on it).
        run: |
          set -euo pipefail
          # Keep a copy of the TAP stream for the timing summary step below
          # (pipefail keeps the suite's exit status).
          mkdir -p "$RUNNER_TEMP/bats-timing"
          date +%s > "$RUNNER_TEMP/bats-timing/start-epoch"
          PATH="/opt/bash32/bin:$PATH" /opt/bash32/bin/bash scripts/test-acq-bats 2>&1 |
            tee "$RUNNER_TEMP/bats-timing/bats.log"
          # Fail closed if this checkout's runner ignored ACQ_BATS_SHARD (it
          # would silently run, and pass, the whole suite on every leg).
          grep -q "^test-acq-bats: shard ${ACQ_BATS_SHARD}:" "$RUNNER_TEMP/bats-timing/bats.log" || {
            echo "::error::scripts/test-acq-bats did not run shard ${ACQ_BATS_SHARD}" >&2
            exit 1
          }

      # Advisory only: never fails the job. always() so it also covers failed
      # and cancelled runs (partial logs are summarized and flagged incomplete).
      # The heading names the leg (ACQ_SHARD_ID), so the per-leg summaries are
      # distinguishable on the run page.
      - name: Summarize bats timings
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        env:
          # Keep in sync with this job's timeout-minutes.
          BATS_JOB_TIMEOUT_MINUTES: '25'
        run: |
          python3 scripts/summarize-bats-timing \
            --log "$RUNNER_TEMP/bats-timing/bats.log" \
            --start-epoch-file "$RUNNER_TEMP/bats-timing/start-epoch" \
            --timeout-minutes "$BATS_JOB_TIMEOUT_MINUTES" \
            --json "$RUNNER_TEMP/bats-timing/timing.json" \
            --summary-file "$GITHUB_STEP_SUMMARY" || true

      - name: Upload bats timing record
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bats-timing-${{ env.ACQ_SHARD_ID }}-${{ github.run_attempt }}
          overwrite: true
          path: ${{ runner.temp }}/bats-timing/timing.json
          if-no-files-found: ignore
          retention-days: 30

  # Always-posting gate: this is what branch protection actually requires,
  # under the ORIGINAL required-check name ("acq offline suite under bash
  # 3.2") — unchanged from before this fix, so no branch-protection/ruleset
  # update is needed. `if: always()` (per GitHub's own required-status-checks
  # troubleshooting doc, "Use always() with needs for required checks that
  # depend on other jobs") makes this job run regardless of whether its
  # dependencies succeeded, failed, or were skipped, so a check-run for this
  # exact context is created on every PR and merge group — closing the original gap
  # where a path-filtered trigger meant no check-run was created at all.
  #
  # Fail-closed logic over the WHOLE dependency chain. The expected outcome is
  # fully determined by `changes`:
  #   - `changes` must be `success` (a failed diff computation must not be
  #     laundered into a pass just because everything downstream was skipped);
  #   - relevant == 'true'  -> `prepare-bash32` AND the matrix job
  #     `test-acq-bash32` must both be `success`. The matrix job's result is
  #     `success` only if EVERY shard leg succeeded; any failed or cancelled leg
  #     makes it `failure`/`cancelled`. A `skipped` matrix job here means the
  #     prepare job failed (needs-skip), which is a failure, not a pass;
  #   - relevant == 'false' -> both must be `skipped` (the correct outcome for an
  #     irrelevant diff); anything else is unexpected and fails.
  # Checking the relevance output, not just the results, is what stops a
  # prepare-job failure (which skips the matrix) from reading as "irrelevant".
  gate:
    name: acq offline suite under bash 3.2
    needs: [changes, prepare-bash32, test-acq-bash32]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Evaluate upstream results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          PREPARE_RESULT: ${{ needs.prepare-bash32.result }}
          TEST_RESULT: ${{ needs.test-acq-bash32.result }}
        run: |
          set -euo pipefail
          echo "changes job result:          $CHANGES_RESULT (relevant=$RELEVANT)"
          echo "prepare-bash32 job result:   $PREPARE_RESULT"
          echo "test-acq-bash32 job result:  $TEST_RESULT (all shard legs)"

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::relevance-detection job did not succeed ($CHANGES_RESULT) — failing closed, not treating this as 'irrelevant'."
            exit 1
          fi

          case "$RELEVANT" in
            true)
              if [ "$PREPARE_RESULT" = "success" ] && [ "$TEST_RESULT" = "success" ]; then
                echo "Gate passes: interpreter prepared and every shard succeeded."
              else
                echo "::error::relevant diff but prepare=$PREPARE_RESULT, offline suite=$TEST_RESULT (every shard must succeed)."
                exit 1
              fi
              ;;
            false)
              if [ "$PREPARE_RESULT" = "skipped" ] && [ "$TEST_RESULT" = "skipped" ]; then
                echo "Gate passes: no bash-3.2-relevant paths changed; suite skipped."
              else
                echo "::error::irrelevant diff but prepare=$PREPARE_RESULT, offline suite=$TEST_RESULT (expected both skipped)."
                exit 1
              fi
              ;;
            *)
              echo "::error::unexpected relevance output '$RELEVANT' — failing closed."
              exit 1
              ;;
          esac
