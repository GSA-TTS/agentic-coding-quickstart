# USAI Model Sync - Updates the generated OpenCode model catalog from the USAI API
# Trusted triggers only. Opens or updates a pull request instead of pushing to main.

name: USAI Model Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * 1'

concurrency:
  group: usai-model-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Sync USAI model catalog
        env:
          USAI_API_KEY: ${{ secrets.USAI_MODELS_API_KEY }}
        run: node scripts/sync-usai-models.mjs --write-snapshot

      - name: Run tests
        run: npm test

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          branch: automation/usai-model-sync
          delete-branch: false
          commit-message: "chore(models): sync usai model catalog"
          title: "chore(models): sync usai model catalog"
          body: |
            ## Summary
            - sync the generated USAI model catalog in `templates/opencode.jsonc`
            - refresh default model selection based on repository policy
            - update the latest rendered snapshot used for review

            ## Notes
            - generated by the trusted USAI model sync workflow
            - runtime entitlement may still differ from `/models` availability
          labels: enhancement
