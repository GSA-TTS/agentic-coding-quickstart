# .pre-commit-config.yaml
# Pre-commit hooks for agentic-coding-quickstart
#
# Installation (optional):
#   pip install pre-commit
#   pre-commit install
#
# Run without installing hooks:
#   pre-commit run --all-files
#
# All hooks pinned to commit SHAs for supply chain security (NIST SA-12)

# The playbook is a pinned git submodule; it has its own hooks/CI. Don't lint it
# from this repo. CHANGELOG.md is release-please-generated; don't lint/reformat it.
exclude: '^(agentic-coding-playbook/|CHANGELOG\.md$)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks

  # Markdown linting
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 996abf60411a8d954288ac9856aae7602b80cbda  # v0.22.1
    hooks:
      - id: markdownlint-cli2
        args: ["--fix"]

  # Shell script linting.
  #
  # We invoke the SYSTEM shellcheck binary via a local hook rather than the
  # shellcheck-py pip package. shellcheck-py downloads the shellcheck binary at
  # build time, which fails behind TLS-intercepting proxies (e.g. ZScaler) with
  # `CERTIFICATE_VERIFY_FAILED` — see docs/KNOWN_FAILURE_MODES.md and #144.
  # Using the binary the developer already installed (brew/apt) needs no network.
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck (system binary)
        description: Lint shell scripts using the locally installed shellcheck.
        entry: shellcheck
        language: system
        types: [shell]
        args: ["--severity=warning"]
