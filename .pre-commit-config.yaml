# .pre-commit-config.yaml
# Pre-commit hooks for agentic-coding-quickstart
#
# Installation (optional):
#   pip install pre-commit
#   pre-commit install
#
# Run without installing hooks:
#   pre-commit run --all-files
#
# All hooks pinned to commit SHAs for supply chain security (NIST SR-3, supersedes withdrawn SA-12)

# CHANGELOG.md is release-please-generated; don't lint/reformat it.
exclude: '^CHANGELOG\.md$'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks

  # Markdown linting
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 996abf60411a8d954288ac9856aae7602b80cbda  # v0.22.1
    hooks:
      - id: markdownlint-cli2
        args: ["--fix"]

  # Shell script linting via the system shellcheck binary
  # (`brew install shellcheck` / `apt install shellcheck`; preinstalled on CI).
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck (system binary)
        # ShellCheck's dataflow analysis blows up pathologically when a very
        # large script (notably acq.backends/msb.sh) is analyzed — it runs
        # effectively forever, hanging CI to the 15-minute cap (SIGTERM → exit
        # 143). Each file ALONE lints in 1–3s. So force ONE FILE PER INVOCATION
        # via `xargs -n1`: this sidesteps the blow-up on every shellcheck version
        # (the `--extended-analysis` flag only exists in >=0.9, and CI's
        # shellcheck is older). `bash -c … --` with a `_` $0 keeps filenames as
        # positional args; `xargs -r` skips an empty batch (never runs argless,
        # which would block reading stdin). The former offender scripts/test-acq
        # was split into scripts/test-acq-lib.sh + scripts/test-acq.d/NN-*.sh so
        # each piece now lints in seconds too (all shell files are picked up by
        # `types: [shell]`).
        entry: bash -c 'printf "%s\n" "$@" | xargs -r -n1 shellcheck --severity=warning' --
        language: system
        types: [shell]
        pass_filenames: true
        require_serial: true

  # acq offline unit suite — runs the host-side logic (backend resolution, name
  # derivation, kit-translate, git-identity/path pre-flight) on every push. This
  # is the Linux behavior gate (CI runs pre-commit on ubuntu-latest); the suite
  # is stubbed/offline (no Docker/network) so it is safe in CI. Also portable to
  # macOS bash 3.2. The runner sources scripts/test-acq-lib.sh and every
  # scripts/test-acq.d/NN-*.sh part, so a change to any of them re-runs it.
  - repo: local
    hooks:
      - id: test-acq
        name: acq offline unit suite
        entry: bash scripts/test-acq
        language: system
        pass_filenames: false
        files: '^(acq|acq\.backends/.*|scripts/test-acq|scripts/test-acq-lib\.sh|scripts/test-acq\.d/.*\.sh)$'
