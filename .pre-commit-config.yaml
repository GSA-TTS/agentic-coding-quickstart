# .pre-commit-config.yaml
# Pre-commit hooks for agentic-coding-quickstart
#
# Installation (optional):
#   pip install pre-commit
#   pre-commit install
#
# Run without installing hooks:
#   pre-commit run --all-files
#
# All hooks pinned to commit SHAs for supply chain security (NIST SA-12)

# CHANGELOG.md is release-please-generated; don't lint/reformat it.
exclude: '^CHANGELOG\.md$'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks

  # Markdown linting
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 996abf60411a8d954288ac9856aae7602b80cbda  # v0.22.1
    hooks:
      - id: markdownlint-cli2
        args: ["--fix"]

  # Shell script linting via the system shellcheck binary
  # (`brew install shellcheck` / `apt install shellcheck`; preinstalled on CI).
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck (system binary)
        # Invoke shellcheck ONE FILE PER PROCESS via `xargs -n1`. ShellCheck's
        # dataflow analysis blows up pathologically when several large scripts
        # (notably acq.backends/msb.sh + scripts/test-acq) are analyzed in one
        # invocation — it can run effectively forever, hanging CI to the
        # timeout cap (SIGTERM → exit 143). Each file alone lints in 1–3s.
        # `xargs -r` skips an empty batch (never runs argless, which would block
        # reading stdin). Version-agnostic (no shellcheck-version-gated flags).
        entry: bash -c 'printf "%s\n" "$@" | xargs -r -n1 shellcheck --severity=warning' --
        language: system
        types: [shell]
        pass_filenames: true
        require_serial: true

  # acq offline unit suite — runs the host-side logic (backend resolution, name
  # derivation, kit-translate, git-identity/path pre-flight) on every push. This
  # is the Linux behavior gate (CI runs pre-commit on ubuntu-latest); the suite
  # is stubbed/offline (no Docker/network) so it is safe in CI. Also portable to
  # macOS bash 3.2.
  - repo: local
    hooks:
      - id: test-acq
        name: acq offline unit suite
        entry: bash scripts/test-acq
        language: system
        pass_filenames: false
        files: '^(acq|acq\.backends/.*|scripts/test-acq)$'
