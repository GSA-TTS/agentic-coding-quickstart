# .pre-commit-config.yaml
# Pre-commit hooks for agentic-coding-quickstart
#
# Installation (optional):
#   pip install pre-commit
#   pre-commit install
#
# Run without installing hooks:
#   pre-commit run --all-files
#
# All hooks pinned to commit SHAs for supply chain security (NIST SA-12)

# CHANGELOG.md is release-please-generated; don't lint/reformat it.
exclude: '^CHANGELOG\.md$'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks

  # Markdown linting
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 996abf60411a8d954288ac9856aae7602b80cbda  # v0.22.1
    hooks:
      - id: markdownlint-cli2
        args: ["--fix"]

  # Shell script linting via the system shellcheck binary
  # (`brew install shellcheck` / `apt install shellcheck`; preinstalled on CI).
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck (system binary)
        # `--` terminates option parsing so filenames are never mistaken for
        # flags; `require_serial` + `pass_filenames` keep pre-commit from ever
        # invoking shellcheck with an empty argument list (argless shellcheck
        # reads from stdin and blocks forever, which hangs CI until it is
        # SIGTERM'd → exit 143). Running once with all files also avoids the
        # per-batch fan-out that could yield an empty batch.
        #
        # `--extended-analysis=false`: shellcheck 0.11's dataflow analysis has a
        # pathological blow-up when several large scripts (notably
        # acq.backends/msb.sh + scripts/test-acq) are analyzed in ONE invocation
        # — it runs effectively forever, hanging CI to the 15-minute cap. The
        # per-file lint results are unchanged without it; we still get every
        # syntax/quoting/severity>=warning finding. (Re-enable if a future
        # shellcheck fixes the slowdown.)
        entry: shellcheck --severity=warning --extended-analysis=false --
        language: system
        types: [shell]
        pass_filenames: true
        require_serial: true

  # acq offline unit suite — runs the host-side logic (backend resolution, name
  # derivation, kit-translate, git-identity/path pre-flight) on every push. This
  # is the Linux behavior gate (CI runs pre-commit on ubuntu-latest); the suite
  # is stubbed/offline (no Docker/network) so it is safe in CI. Also portable to
  # macOS bash 3.2.
  - repo: local
    hooks:
      - id: test-acq
        name: acq offline unit suite
        entry: bash scripts/test-acq
        language: system
        pass_filenames: false
        files: '^(acq|acq\.backends/.*|scripts/test-acq)$'
