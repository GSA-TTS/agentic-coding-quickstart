# .pre-commit-config.yaml
# Pre-commit hooks for agentic-coding-quickstart
#
# Installation (optional):
#   pip install pre-commit
#   pre-commit install
#
# Run without installing hooks:
#   pre-commit run --all-files
#
# All hooks pinned to commit SHAs for supply chain security (NIST SR-3, supersedes withdrawn SA-12)

# CHANGELOG.md is release-please-generated; don't lint/reformat it.
exclude: '^CHANGELOG\.md$'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks

  # Markdown linting
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 996abf60411a8d954288ac9856aae7602b80cbda  # v0.22.1
    hooks:
      - id: markdownlint-cli2
        args: ["--fix"]

  # Shell script linting via the system shellcheck binary
  # (`brew install shellcheck` / `apt install shellcheck`; preinstalled on CI).
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck (system binary)
        # The repo-root .shellcheckrc sets `extended-analysis=false`, disabling
        # ShellCheck's dataflow pass. That pass grew superlinearly in MEMORY and
        # OOM-killed the process (~1.9 GB RSS) on this repo's largest scripts
        # (notably acq.backends/msb.sh); with it off, memory is a non-issue
        # (~135 MB even across all shell files). Core correctness/quoting checks
        # (SC2086/2154/2034/1090/…) are unaffected. See .shellcheckrc.
        #
        # We still bound the batch size with `xargs -n8`: even with the dataflow
        # pass off, ShellCheck's per-run wall-clock grows superlinearly with the
        # number of files held in ONE invocation (all ~39 files at once takes
        # >100s; batches of 8 finish in ~10s total). `xargs -r` skips an empty
        # batch (never runs argless, which would block reading stdin); `bash -c
        # … --` with a `_` $0 keeps filenames as positional args.
        entry: bash -c 'printf "%s\n" "$@" | xargs -r -n8 shellcheck --severity=warning' --
        language: system
        types: [shell]
        pass_filenames: true
        require_serial: true

  # acq offline unit suite — runs the host-side logic (backend resolution, name
  # derivation, kit-translate, git-identity/path pre-flight) on every push via
  # bats-core (ADR-0025). This is the Linux behavior gate (CI runs pre-commit on
  # ubuntu-latest); the suite is stubbed/offline (no Docker/network) so it is
  # safe in CI. The vendored bats runner (test/vendor/bats-core) and the tests
  # (test/bats/*.bats) reuse the stub library scripts/test-acq-lib.sh via
  # test/bats/helper.bash, so a change to acq, the adapters, the stub library, or
  # any test re-runs it.
  - repo: local
    hooks:
      - id: test-acq
        name: acq offline unit suite (bats)
        entry: bash scripts/test-acq-bats
        language: system
        pass_filenames: false
        files: '^(acq|acq\.backends/.*|scripts/test-acq-lib\.sh|scripts/test-acq-bats|test/bats/.*)$'

      # Lint the .bats files with ShellCheck (it treats .bats as a shell dialect).
      # The main shellcheck hook's `types: [shell]` does not reliably tag .bats,
      # so target them explicitly here. helper.bash is already covered by the main
      # hook (it is tagged shell), but including it is harmless.
      - id: shellcheck-bats
        name: shellcheck (bats suite)
        entry: bash -c 'printf "%s\n" "$@" | xargs -r -n8 shellcheck --severity=warning' --
        language: system
        files: '^test/bats/.*\.(bats|bash)$'
