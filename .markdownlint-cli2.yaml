# markdownlint-cli2 configuration
# Aligned with playbook standards for consistency
# See: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md

config:
  # MD003 - Heading style (disabled — mixed styles OK)
  MD003: false
  # MD007 - Unordered list indent (allow 2-space, frontmatter false positives)
  MD007: false
  # MD004 - Unordered list style (disabled — mixed markers OK)
  MD004: false
  # MD013 - Line length (disabled — long lines OK in docs)
  MD013: false
  # MD022 - Headings should be surrounded by blank lines
  MD022: false
  # MD024 - No duplicate heading names (disabled — repeated names OK)
  MD024: false
  # MD025 - Single top-level heading (disabled — multiple H1 OK)
  MD025: false
  # MD026 - No trailing punctuation in headings
  MD026: false
  # MD031 - Fenced code blocks surrounded by blank lines
  MD031: false
  # MD032 - Lists surrounded by blank lines
  MD032: false
  # MD033 - No inline HTML (disabled — HTML allowed)
  MD033: false
  # MD034 - No bare URLs
  MD034: false
  # MD036 - No emphasis used instead of heading
  MD036: false
  # MD040 - Fenced code blocks should have language
  MD040: false
  # MD041 - First line in file should be H1
  MD041: false
  # MD051 - Link fragments should be valid
  MD051: false
  # MD056 - Table column count
  MD056: false
  # MD058 - Tables should be surrounded by blank lines
  MD058: false
  # MD060 - Table column style spacing
  MD060: false

# Scan these files
# Scan these files. This is the SINGLE source of truth for file selection: both
# the pre-commit hook and markdown-quality.yml invoke markdownlint-cli2 with no
# glob arguments, so neither can select a different set. Previously CI passed
# "**/*.md" plus exclusions on the command line (49 files) while these globs
# alone selected 9, so the commit-time hook checked 18% of what CI checked.
globs:
  - "**/*.md"

# Ignore files
ignores:
  - "node_modules"
  - ".github/linters/node_modules"
  - "deleteme"
  - "tmp"
  - "CHANGELOG.md"
  # Vendored, SHA-pinned bats submodules (ADR-0025) -- third-party markdown we do
  # not own and must not lint to our rules. markdown-quality.yml checks out
  # WITHOUT submodules so it never saw these, but pre-commit.yml uses
  # `submodules: true` for the bats hook, so the pre-commit run WOULD: measured
  # 21 vendored .md files producing 235 issues in 13 files. Excluding them here
  # preserves the existing effective coverage rather than widening it.
  - "test/vendor"

# Support YAML frontmatter
frontMatter: "/^---\\s*$[\\s\\S]*?^---\\s*$/m"
